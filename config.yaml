web:
  allowed_client_ip: ""
serial:
  backend: zl_is2
  port: /dev/ttyS1
  baudrate: 115200
  timeout_sec: 0.05
  read_timeout_sec: 0.6
safety:
  vin_low_mv: 7000
  vin_stop_mv: 6800
  max_parallel_axes: 3
  min_duration_ms: 800
  heavy_axis_ids:
  - 1
  - 2
  heavy_axis_min_duration_ms: 1200
joints:
