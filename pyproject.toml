[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-robotic-arm-control"
version = "0.1.0"
description = "Quectel Pi M2 six-axis bus-servo arm demo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "pyserial>=3.5",
  "PyYAML>=6.0",
  "fastapi>=0.115",
  "uvicorn>=0.34"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
